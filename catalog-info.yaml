# Backstage catalog descriptor. Discovered automatically -- the portal's GitHub
# provider reads catalog-info.yaml from the default branch of every repo the
# tnoff-backstage App can see, so adding this file is the whole of onboarding.
#
# github.com/project-slug is DERIVED by the portal's AnnotateScmSlugEntityProcessor
# from the location this file was fetched from. techdocs-ref is set below now that
# mkdocs.yml + docs/ exist and .github/workflows/self-techdocs-publish.yml publishes
# them; the kubernetes / grafana annotations still assert targets that don't exist
# yet, so they stay out until those plugins are wired up.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: github-workflows
  description: >-
    Reusable GitHub Actions workflows -- the CI and release surface for the whole fleet.
    Consumed through `uses:` at a pinned SHA, which Renovate keeps current. Imported by
    nearly every repo here; only terraform, terraform-admin, terraform-modules and
    docker-apps draw the dependsOn edge explicitly, since those are what actually applies
    to the fleet. The rest of the fan-in is still left undrawn, as an edge from everything
    to one node is noise rather than information.
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: library
  owner: group:default/admin
  lifecycle: production
