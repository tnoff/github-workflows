name: Release

# Reusable workflow: cut a GitHub release for a tag the tag workflow created,
# with notes lifted from the changelog section for that version.
#
# GitLab counterpart: /gitlab/release.yml. The 25-line curl + jq + HTTP-code
# dance against the releases API becomes one `gh release create`; the awk that
# extracts the version's section from CHANGELOG.md is carried over unchanged,
# because that logic is about the changelog format, not the platform.
#
# Inputs replace the dotenv handoff: pass the tag workflow's outputs straight
# through.
#
#   jobs:
#     tag:
#       uses: tnoff/github-workflows/.github/workflows/tag.yml@<sha>
#       secrets: {push_token: ${{ secrets.GIT_PUSH_TOKEN }}}
#     release:
#       needs: tag
#       uses: tnoff/github-workflows/.github/workflows/release.yml@<sha>
#       with:
#         version: ${{ needs.tag.outputs.version }}
#         tag_created: ${{ needs.tag.outputs.tag_created }}
#
on:
  workflow_call:
    inputs:
      version:
        description: 'Tag to release, with leading v (from the tag workflow)'
        required: true
        type: string
      tag_created:
        description: 'Whether the tag workflow actually created a tag'
        required: true
        type: string
      changelog_file:
        description: 'Path to the assembled changelog'
        required: false
        type: string
        default: 'CHANGELOG.md'
      runner_labels:
        description: 'Runner labels as JSON array (e.g., ["self-hosted", "oke"])'
        required: false
        type: string
        default: '["ubuntu-24.04"]'

jobs:
  release:
    name: Release
    # Skip cleanly when the tag job deferred or found an existing tag, matching
    # the GitLab template's TAG_CREATED check.
    if: inputs.tag_created == 'true'
    runs-on: ${{ fromJson(inputs.runner_labels) }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CHANGELOG_FILE: ${{ inputs.changelog_file }}
        run: |
          set -euo pipefail

          if [ -z "${VERSION}" ]; then
            echo "::error::version is empty but tag_created was true -- did the tag job emit its outputs?"
            exit 1
          fi

          RAW_VERSION="${VERSION#v}"
          NOTES=""
          if [ -f "${CHANGELOG_FILE}" ]; then
            # Lines after `## [RAW_VERSION]` up to the next `## [` heading.
            NOTES=$(awk -v ver="${RAW_VERSION}" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' "${CHANGELOG_FILE}" | sed '/./,$!d')
          else
            echo "${CHANGELOG_FILE} not found -- using a generic description."
          fi

          if [ -z "${NOTES}" ]; then
            echo "No changelog entry for ${RAW_VERSION} -- using a generic description."
            NOTES="Release ${VERSION}"
          fi

          echo "Release notes for ${VERSION}:"
          echo "----"
          echo "${NOTES}"
          echo "----"

          printf '%s\n' "${NOTES}" > /tmp/release-notes.md
          gh release create "${VERSION}" \
            --title "Release ${VERSION}" \
            --notes-file /tmp/release-notes.md
          echo "Release created for ${VERSION}"
