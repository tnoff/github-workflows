name: Scheduled

# Replaces the GitLab weekly pipeline schedule (Sunday 06:09 UTC), deactivated
# when this repo flipped. Same cadence, same single job -- the GitLab config
# ran renovate on schedule and nothing else, and no branch-cleanup was ever
# wired here.

on:
  schedule:
    - cron: '9 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    uses: ./.github/workflows/renovate.yml
    with:
      # Keeps the default terraform-docs entry and adds the version-bump task
      # from renovate.json (renovate-bump-versions.sh).
      allowed_commands: >-
        ["^bash ci/renovate-terraform-docs\\.sh$",
        "^bash \\.github/scripts/renovate-bump-versions\\.sh$"]
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}
