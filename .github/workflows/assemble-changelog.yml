name: Assemble changelog

# Reusable workflow: fold accumulated changelog.d/*.md fragments into
# CHANGELOG.md on the default branch at release time, delete them, and push
# back. Idempotent -- a no-op when there are no fragments, which is what keeps
# the run it triggers from looping.
#
# Ported from the now-deleted GitLab template /gitlab/assemble-changelog.yml. The awk that turns a
# fragment into bullets and the awk that splices the new section above the
# first `## [` heading are carried over unchanged: that logic is about the
# changelog format, not the platform, and both encode bugs already paid for
# (a hard-wrapped paragraph becoming one bullet per line, a fragment written
# with its own `- ` becoming `- - `).
#
# One package or many. By default one `version_file` and one `changelog_dir` /
# `changelog_file` at the repo root. A repo that versions several packages
# independently sets `version_files_command` (the same input bump-version takes)
# and each package then keeps its own fragments and changelog beside its version
# file. Every package's fold lands in ONE commit and one push: seven pushes
# would trigger seven follow-up runs, and the fragment-gated tag only wants one.
#
# ---------------------------------------------------------------------------
# This workflow pushes to the DEFAULT BRANCH, which the fleet's rulesets protect
# ---------------------------------------------------------------------------
# Two requirements follow, and both fail confusingly if missed:
#
#   1. The token must belong to an identity the ruleset lets through. That
#      used to mean the repository-admin role -- a human's admin PAT, holding
#      a bypass over every rule, written to 16 repos for one push per release.
#      It is now the tnoff-ci App, named as an `Integration` bypass actor on
#      every ruleset. A write-scoped bot account still does NOT work: its push
#      is rejected, not the API call before it.
#   2. The token must not be the default GITHUB_TOKEN. The whole
#      fragment-gating design depends on this push triggering a FOLLOW-UP run:
#      the tag job defers while fragments are pending, the fold push clears
#      them, and the follow-up run tags against the assembled changelog. A push
#      made with GITHUB_TOKEN triggers nothing, so the tag is never cut and the
#      release never happens -- with every job green.
#
on:
  workflow_call:
    inputs:
      version_file:
        description: 'Path to the version file'
        required: false
        type: string
        default: 'VERSION'
      version_file_type:
        description: "File type: 'plain' or 'json'"
        required: false
        type: string
        default: 'plain'
      version_json_key:
        description: 'Key holding the version when version_file_type is json'
        required: false
        type: string
        default: 'version'
      version_files_command:
        description: >-
          Bash command, run from the repo root on the default branch, that
          prints the version files of every package to fold -- one path per
          line, relative to the repo root. Replaces version_file when set (all
          files share version_file_type and version_json_key). Each package is
          folded on its own, but all the folds land in ONE commit and one push,
          so a repo with several independently versioned packages gets a single
          follow-up run rather than one per package. With this set,
          changelog_dir and changelog_file are resolved beside each version
          file (<dir of the version file>/<changelog_dir>), not at the repo
          root. A package with no fragments is skipped. Empty (default) folds
          the single version_file.
        required: false
        type: string
        default: ''
      changelog_dir:
        description: 'Directory holding unassembled fragments'
        required: false
        type: string
        default: 'changelog.d'
      changelog_file:
        description: 'Path to the assembled changelog'
        required: false
        type: string
        default: 'CHANGELOG.md'
      runner_labels:
        description: 'Runner labels as JSON array (e.g., ["self-hosted", "oke"])'
        required: false
        type: string
        default: '["ubuntu-24.04"]'
    secrets:
      app_client_id:
        description: >-
          Client ID of the tnoff-ci GitHub App (CI_APP_CLIENT_ID). The
          Iv23li... form, NOT the numeric App ID -- create-github-app-token
          deprecated its `app-id` input in favour of `client-id`. The numeric
          ID is still what the ruleset bypass actor keys on, so both exist and
          they are not interchangeable.
        required: true
      app_private_key:
        description: 'Private key PEM of the tnoff-ci GitHub App (CI_APP_PRIVATE_KEY).'
        required: true
    outputs:
      assembled:
        description: 'Whether a fold commit was pushed (true/false)'
        value: ${{ jobs.assemble.outputs.assembled }}

jobs:
  assemble:
    name: Assemble changelog
    runs-on: ${{ fromJson(inputs.runner_labels) }}
    permissions:
      contents: write
    outputs:
      assembled: ${{ steps.assemble.outputs.assembled }}
    steps:
      # Short-lived installation token for the tnoff-ci App, minted per run.
      #
      # Replaces the human admin PAT this used to carry. The fleet's rulesets
      # name the App as a bypass actor (actor_type "Integration", confirmed by
      # reading the ruleset back on dappertable), so it can push to a protected
      # `main` -- and unlike GITHUB_TOKEN its pushes DO trigger the follow-up
      # run the release depends on. The token expires in an hour and can only
      # write contents and workflows: it cannot change settings, edit rulesets,
      # approve a review, or merge a PR.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.app_client_id }}
          private-key: ${{ secrets.app_private_key }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Assemble
        id: assemble
        env:
          VERSION_FILE: ${{ inputs.version_file }}
          VERSION_FILES_COMMAND: ${{ inputs.version_files_command }}
          VERSION_FILE_TYPE: ${{ inputs.version_file_type }}
          VERSION_JSON_KEY: ${{ inputs.version_json_key }}
          CHANGELOG_DIR: ${{ inputs.changelog_dir }}
          CHANGELOG_FILE: ${{ inputs.changelog_file }}
        run: |
          set -euo pipefail

          MULTI=false
          [ -n "${VERSION_FILES_COMMAND}" ] && MULTI=true

          read_version() {
            if [ "${VERSION_FILE_TYPE}" = "json" ]; then
              jq -r --arg key "${VERSION_JSON_KEY}" '.[$key]' "$1" | tr -d '[:space:]'
            else
              tr -d '[:space:]' < "$1"
            fi
          }

          # Folds one package's fragments into its changelog and stages the
          # result. Args: version file, fragment dir, changelog file. Returns 0
          # with nothing staged when there are no fragments. Sets FOLDED_VERSION.
          fold() {
            local vfile="$1" fdir="$2" cfile="$3"
            FOLDED_VERSION=""

            if ! ls "${fdir}"/*.md >/dev/null 2>&1; then
              echo "No changelog fragments in ${fdir} -- nothing to assemble."
              return 0
            fi

            local version date
            version=$(read_version "${vfile}")
            date=$(date -u +%Y-%m-%d)

            # Refuse to fold into an already-released version. Without this, a
            # fragment whose PR forgot to bump the version file is filed under a
            # version that is already tagged: a second "## [$version]" block is
            # appended, the tag job then finds the tag present and skips, release
            # skips with it, and every job goes green while the change ships with
            # no release of its own. Choosing the next version is the author's
            # call, so fail loudly instead of guessing.
            local version_re
            version_re=$(printf '%s' "${version}" | sed 's/[][\.*^$\/]/\\&/g')
            if [ -f "${cfile}" ] && grep -q "^## \[${version_re}\]" "${cfile}"; then
              echo "::error::${cfile} has a '## [${version}]' section but fragments remain."
              {
                echo "  Fragments still pending in ${fdir}:"
                printf '    %s\n' "${fdir}"/*.md
                echo "  Whatever added them did not bump ${vfile}, so folding now"
                echo "  would file the change under an already-released version and it"
                echo "  would never be tagged. Bump ${vfile} and re-run."
              } >&2
              exit 1
            fi

            local section tmp f
            section=$(mktemp)
            {
              printf '## [%s] - %s\n\n### Changed\n\n' "${version}" "${date}"
              for f in "${fdir}"/*.md; do
                # A bullet is a PARAGRAPH, not a physical line. Prefixing every
                # non-empty line with '- ' broke three ways: a hard-wrapped
                # paragraph became one bullet per line, a fragment already
                # written with '- ' became '- - ', and a deliberate list could
                # not be distinguished from a wrapped sentence.
                awk '
                  function flush() { if (buf != "") { print "- " buf; buf = "" } }
                  /^[[:space:]]*$/                { flush(); next }
                  /^[[:space:]]*[-*][[:space:]]+/ { flush(); sub(/^[[:space:]]*[-*][[:space:]]+/, ""); buf = $0; next }
                                                  { sub(/^[[:space:]]+/, ""); buf = (buf == "" ? $0 : buf " " $0) }
                  END                             { flush() }
                ' "$f"
              done
              printf '\n'
            } > "${section}"

            tmp=$(mktemp)
            if [ -f "${cfile}" ] && grep -q '^## \[' "${cfile}"; then
              awk -v sect="${section}" '
                !done && /^## \[/ { while ((getline l < sect) > 0) print l; done=1 }
                { print }
              ' "${cfile}" > "${tmp}"
            elif [ -f "${cfile}" ]; then
              cat "${cfile}" "${section}" > "${tmp}"
            else
              printf '# Changelog\n\n' > "${tmp}"
              cat "${section}" >> "${tmp}"
            fi
            mv "${tmp}" "${cfile}"

            git rm -q "${fdir}"/*.md

            echo "Assembled changelog section for ${vfile} (${version}):"
            echo "----"
            cat "${section}"
            echo "----"

            git add "${cfile}"
            FOLDED_VERSION="${version}"
          }

          if [ "${MULTI}" = "true" ]; then
            OUT=$(bash -c "${VERSION_FILES_COMMAND}")
            FILES=()
            while IFS= read -r line; do
              [ -n "${line}" ] && FILES+=("${line}")
            done < <(printf '%s\n' "${OUT}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          else
            FILES=("${VERSION_FILE}")
          fi

          FOLDED=()
          for vfile in "${FILES[@]+"${FILES[@]}"}"; do
            if [ "${MULTI}" = "true" ]; then
              case "${vfile}" in
                /*|..|../*|*/../*|*/..)
                  echo "::error::version file '${vfile}' must be a path inside the repo."; exit 1 ;;
              esac
              # Fragment dir and changelog live beside each version file.
              dir=$(dirname "${vfile}")
              fold "${vfile}" "${dir}/${CHANGELOG_DIR}" "${dir}/${CHANGELOG_FILE}"
            else
              fold "${vfile}" "${CHANGELOG_DIR}" "${CHANGELOG_FILE}"
            fi
            [ -n "${FOLDED_VERSION}" ] && FOLDED+=("${vfile}: ${FOLDED_VERSION}")
          done

          if [ "${#FOLDED[@]}" -eq 0 ]; then
            echo "assembled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${MULTI}" = "true" ]; then
            # Keep the `docs: assemble changelog` prefix: consumers key off it
            # to skip the follow-up run this push triggers.
            git commit -m "docs: assemble changelog for ${#FOLDED[@]} package(s)" \
              -m "$(printf '%s\n' "${FOLDED[@]}")"
          else
            git commit -m "docs: assemble changelog for ${FOLDED[0]#*: }"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "assembled=true" >> "$GITHUB_OUTPUT"
