name: Docker push

# Reusable workflow: build an image and push it to OCIR under two tags
# (`latest`/`tag_override` plus an immutable per-commit tag), or just the
# first if the caller sets single_tag: true.
#
# Ported from the now-deleted GitLab template /gitlab/buildkit-docker-push.yml. Three things go away.
#
# The bespoke buildkit setup: that template started an ephemeral in-job
# buildkitd on a unix socket (which needed a privileged pod) and drove it with
# buildctl, because the cluster buildkitd Deployment had been retired so the ci
# pool could scale to zero. docker/setup-buildx-action replaces all of it.
#
# The S3 layer cache on OCI Object Storage, and with it the ephemeral-storage
# tuning. `--export-cache mode=max` writes every intermediate layer to disk
# before shipping it, which is why those jobs carried
# KUBERNETES_EPHEMERAL_STORAGE_REQUEST 12Gi / LIMIT 18Gi -- discord-bot measured
# 16.4 GiB. A GitHub-hosted runner has roughly 14 GB, so the GitLab shape would
# not have fitted. GitHub's own cache backend replaces it with no local
# multiplier.
#
# The base64 wrapping of every OCI credential: OCI_USERNAME_64 and friends were
# base64-encoded because GitLab masking requires single-line values with a
# restricted character set. GitHub secrets have no such constraint, so they are
# passed as-is and the decode step is gone.
#
# PLATFORM defaulted to linux/arm64 with no repo overriding it, which the
# migration spec flagged as a hard part. Paired with ubuntu-24.04-arm it is a
# native build rather than a QEMU cross-build, and arm64 runners are free for
# public repos.
#
on:
  workflow_call:
    inputs:
      context:
        description: 'Build context directory'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to the Dockerfile, relative to the repo root'
        required: false
        type: string
        default: 'Dockerfile'
      build_args:
        description: 'Newline-separated build args (KEY=value per line)'
        required: false
        type: string
        default: ''
      platform:
        description: 'Target platform'
        required: false
        type: string
        default: 'linux/arm64'
      tag_override:
        description: >-
          When set, tags are <override> and <override>-<short sha> instead of
          `latest` and <short sha>. Used by producers that publish variants.
        required: false
        type: string
        default: ''
      single_tag:
        description: >-
          Push only the primary tag, no immutable per-commit second tag.
          Default false preserves today's behavior for every existing
          consumer. For producers where nothing ever pulls a specific past
          build -- a laptop-rebuilt dev tool, not a deployed workload -- an
          unbounded per-merge tag is pure accumulation with no consumer, and
          `secondary_tag` comes back empty rather than computed-but-unused.
        required: false
        type: boolean
        default: false
      cache:
        description: 'Use the GitHub Actions layer cache'
        required: false
        type: boolean
        default: true
      runner_labels:
        description: 'Runner labels as JSON array'
        required: false
        type: string
        default: '["ubuntu-24.04-arm"]'
      # These three are INPUTS, not secrets, and that is load-bearing.
      #
      # GitHub refuses to set a job output whose value contains secret
      # material, silently leaving it empty. The image reference is built from
      # all three, so while they were secrets the `image` output came back
      # blank in the calling workflow -- the push worked, but trigger-bump then
      # sent an empty IMAGE_NAME to docker-apps, where an empty pipeline
      # variable OVERRODE the job's own value and the bump failed with
      # "IMAGE_NAME not configured on this job".
      #
      # They are also not credentials: a registry host, an object-storage
      # namespace and a repository name. They were masked on GitLab only
      # because GitLab masks broadly. Only oci_username and oci_token are
      # secret.
      registry:
        description: 'OCIR registry host, e.g. iad.ocir.io'
        required: true
        type: string
      namespace:
        description: 'OCI object storage namespace'
        required: true
        type: string
      repo_name:
        description: 'Repository name within the namespace'
        required: true
        type: string
    secrets:
      oci_username:
        description: 'OCIR username, <namespace>/<user>'
        required: true
      oci_token:
        description: 'OCIR auth token'
        required: true
    outputs:
      image:
        description: 'Full image reference without a tag'
        value: ${{ jobs.push.outputs.image }}
      primary_tag:
        description: 'The moving tag (latest, or tag_override)'
        value: ${{ jobs.push.outputs.primary_tag }}
      secondary_tag:
        description: 'The immutable per-commit tag, or empty when single_tag is true'
        value: ${{ jobs.push.outputs.secondary_tag }}

jobs:
  push:
    name: Build and push
    runs-on: ${{ fromJson(inputs.runner_labels) }}
    permissions:
      contents: read
    outputs:
      image: ${{ steps.refs.outputs.image }}
      primary_tag: ${{ steps.refs.outputs.primary_tag }}
      secondary_tag: ${{ steps.refs.outputs.secondary_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Resolve image reference and tags
        id: refs
        env:
          REGISTRY: ${{ inputs.registry }}
          NAMESPACE: ${{ inputs.namespace }}
          REPO_NAME: ${{ inputs.repo_name }}
          TAG_OVERRIDE: ${{ inputs.tag_override }}
          SINGLE_TAG: ${{ inputs.single_tag }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          IMAGE="${REGISTRY}/${NAMESPACE}/${REPO_NAME}"
          if [ -n "${TAG_OVERRIDE}" ]; then
            PRIMARY="${TAG_OVERRIDE}"
            SECONDARY="${TAG_OVERRIDE}-${SHORT_SHA}"
          else
            PRIMARY="latest"
            SECONDARY="${SHORT_SHA}"
          fi
          if [ "${SINGLE_TAG}" = "true" ]; then
            TAGS="${IMAGE}:${PRIMARY}"
            SECONDARY=""
          else
            TAGS="$(printf '%s:%s\n%s:%s' "${IMAGE}" "${PRIMARY}" "${IMAGE}" "${SECONDARY}")"
          fi
          {
            echo "image=${IMAGE}"
            echo "primary_tag=${PRIMARY}"
            echo "secondary_tag=${SECONDARY}"
            echo "tags<<TAGS_EOF"
            echo "${TAGS}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to OCIR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.oci_username }}
          password: ${{ secrets.oci_token }}

      # Both tags in one invocation (or the one tag single_tag leaves). The
      # GitLab template ran buildctl twice, once per tag, because a single
      # buildctl build takes one --output; the second run was fully cached
      # but still re-exported. build-push-action takes a tag list, so the
      # image is built once and every tag points at the same digest -- which
      # also avoids the "push displaces sibling tag" behaviour the fleet has
      # hit before with identical digests. The list itself is computed in the
      # resolve step above (steps.refs.outputs.tags), not inlined here, so
      # single_tag only has to be branched on once.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platform }}
          build-args: ${{ inputs.build_args }}
          push: true
          tags: ${{ steps.refs.outputs.tags }}
          cache-from: ${{ inputs.cache && 'type=gha' || '' }}
          cache-to: ${{ inputs.cache && 'type=gha,mode=min' || '' }}
