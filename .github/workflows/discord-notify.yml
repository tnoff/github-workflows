name: Discord Failure Notification

on:
  workflow_call:
    inputs:
      message:
        description: 'Additional context or failure message to include in the notification'
        required: false
        type: string
        default: ''
      runner_labels:
        description: 'Runner labels as JSON array (e.g., ["self-hosted", "oke"])'
        required: false
        type: string
        default: '["ubuntu-24.04"]'
      # Source-run overrides.
      #
      # A reusable workflow runs INSIDE the caller's run, so github.run_id,
      # github.workflow and github.sha all describe the caller. That is correct
      # when a job notifies about its own workflow, and wrong when
      # notify-failure.yml reports on a run that already finished: every field
      # would name the notifier instead of the failure.
      #
      # Each defaults to empty and falls back to the caller's context below, so
      # existing callers keep their current behaviour untouched.
      source_repo:
        description: >-
          owner/repo of the run being reported. Defaults to the calling repo.
          Load-bearing for a fleet-wide caller: startup-failure-sweep.yml runs
          in github-workflows and reports on other repos, so without this every
          alert would name github-workflows as the repository that failed.
        required: false
        type: string
        default: ''
      source_run_url:
        description: 'URL of the run being reported. Defaults to the calling run.'
        required: false
        type: string
        default: ''
      source_workflow:
        description: 'Name of the workflow being reported. Defaults to the calling workflow.'
        required: false
        type: string
        default: ''
      source_branch:
        description: 'Branch of the run being reported. Defaults to the calling ref.'
        required: false
        type: string
        default: ''
      source_actor:
        description: 'Actor who triggered the run being reported. Defaults to the calling actor.'
        required: false
        type: string
        default: ''
      source_sha:
        description: 'Commit SHA of the run being reported. Defaults to the calling SHA.'
        required: false
        type: string
        default: ''
    secrets:
      discord_webhook_url:
        description: 'Discord webhook URL for failure notifications'
        required: true

jobs:
  notify:
    runs-on: ${{ fromJson(inputs.runner_labels) }}
    steps:
      - name: Send Discord failure notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.discord_webhook_url }}
          EXTRA_MESSAGE: ${{ inputs.message }}
          WORKFLOW_URL: >-
            ${{ inputs.source_run_url != '' && inputs.source_run_url
            || format('{0}/{1}/actions/runs/{2}',
            github.server_url, github.repository, github.run_id) }}
          REPO: ${{ inputs.source_repo != '' && inputs.source_repo || github.repository }}
          BRANCH: ${{ inputs.source_branch != '' && inputs.source_branch || github.ref_name }}
          WORKFLOW_NAME: ${{ inputs.source_workflow != '' && inputs.source_workflow || github.workflow }}
          ACTOR: ${{ inputs.source_actor != '' && inputs.source_actor || github.actor }}
          COMMIT_SHA: ${{ inputs.source_sha != '' && inputs.source_sha || github.sha }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error

          # An unset secret used to reach urllib as an empty string and raise
          # ValueError: unknown url type: '' -- an unhandled traceback, for the
          # one failure this workflow exists to make legible. Observed for real
          # on 2026-09-06 when notify-failure.yml went live in a repo before the
          # terraform apply that grants the secret.
          #
          # Still exits non-zero: a silent no-op would mean a repo could be
          # missing the secret indefinitely with nothing to show for it.
          webhook_url = os.environ.get("DISCORD_WEBHOOK_URL", "")
          if not webhook_url:
              print(
                  "::error::DISCORD_WEBHOOK_URL is empty or unset. "
                  "terraform/infra/repos.tf writes it to every managed repo via "
                  "local.github_actions_secrets; terraform and terraform-admin "
                  "get it from github_actions_secret.ci_alerts_webhook.",
                  file=sys.stderr,
              )
              sys.exit(1)
          extra_message = os.environ.get("EXTRA_MESSAGE", "")

          fields = [
              {"name": "Repository", "value": os.environ["REPO"], "inline": True},
              {"name": "Branch", "value": os.environ["BRANCH"], "inline": True},
              {"name": "Workflow", "value": os.environ["WORKFLOW_NAME"], "inline": True},
              {"name": "Actor", "value": os.environ["ACTOR"], "inline": True},
              {"name": "Commit", "value": f"`{os.environ['COMMIT_SHA'][:7]}`", "inline": False},
              {"name": "Run URL", "value": os.environ["WORKFLOW_URL"], "inline": False},
          ]

          if extra_message:
              fields.append({"name": "Message", "value": extra_message, "inline": False})

          payload = json.dumps({
              "embeds": [{
                  "title": "Workflow Failed",
                  "color": 15158332,
                  "fields": fields,
              }]
          })

          req = urllib.request.Request(
              webhook_url,
              data=payload.encode(),
              # Cloudflare sits in front of Discord and rejects urllib's default
              # User-Agent ("Python-urllib/3.x") with 403 and error code 1010,
              # before the request reaches the API at all. Discord's docs
              # require a User-Agent on API requests; this is that.
              #
              # Measured 2026-09-06 against a bogus webhook id, which separates
              # "blocked by Cloudflare" from "reached Discord":
              #   default UA  -> 403, body 'error code: 1010'
              #   explicit UA -> 404, {"message": "Unknown Webhook"}
              #
              # Latent since this workflow was written: it had no callers until
              # notify-failure.yml, so the request path had never run once.
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "tnoff-ci-notifier (https://github.com/tnoff, 1.0)",
              },
              method="POST",
          )
          try:
              urllib.request.urlopen(req)
              print("Discord notification sent")
          except urllib.error.HTTPError as e:
              print(f"Failed to send Discord notification: {e.code} {e.reason}", file=sys.stderr)
              sys.exit(1)
          except urllib.error.URLError as e:
              print(f"Could not reach Discord: {e.reason}", file=sys.stderr)
              sys.exit(1)
          PYEOF
