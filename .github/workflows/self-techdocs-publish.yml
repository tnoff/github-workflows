name: Publish TechDocs

# This repo's OWN TechDocs publish, ported from the pattern in
# tnoff/terraform-modules (this workflow's first caller -- see
# techdocs-publish.yml's header). `self-` prefix per self-ci.yml's
# convention: a LOCAL `uses:` path rather than a pinned
# tnoff/github-workflows@<sha> ref, so a PR that edits techdocs-publish.yml
# is published with the edited techdocs-publish.yml, not last release's copy.
#
# TECHDOCS_S3_* secrets come from oci/oci.tf's backstage_techdocs_ci_creds,
# wired in by infra/repos.tf's github_workflows module -- same identity class
# terraform-modules uses, scoped to just the backstage_techdocs bucket.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'catalog-info.yaml'
      - '.github/workflows/techdocs-publish.yml'
      - '.github/workflows/self-techdocs-publish.yml'

concurrency:
  group: techdocs-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Generate and publish
    uses: ./.github/workflows/techdocs-publish.yml
    with:
      entity_ref: default/Component/github-workflows
    secrets:
      techdocs_s3_access_key_id: ${{ secrets.TECHDOCS_S3_ACCESS_KEY_ID }}
      techdocs_s3_secret_access_key: ${{ secrets.TECHDOCS_S3_SECRET_ACCESS_KEY }}
      techdocs_s3_bucket_name: ${{ secrets.TECHDOCS_S3_BUCKET_NAME }}
      techdocs_s3_endpoint: ${{ secrets.TECHDOCS_S3_ENDPOINT }}
      techdocs_s3_region: ${{ secrets.TECHDOCS_S3_REGION }}
