name: Publish TechDocs

# This repo's OWN TechDocs publish, ported from the pattern in
# tnoff/terraform-modules (this workflow's first caller -- see
# techdocs-publish.yml's header). `self-` prefix per self-ci.yml's
# convention: a LOCAL `uses:` path rather than a pinned
# tnoff/github-workflows@<sha> ref, so a PR that edits techdocs-publish.yml
# is published with the edited techdocs-publish.yml, not last release's copy.
#
# Publishes with a short-lived OCI token from this job's GitHub OIDC identity, not a stored S3 key
# (tnoff/terraform#217). OCI maps this repo's push to main to the user that may write only
# default/component/github-workflows/ in the TechDocs bucket (terraform-admin techdocs-publishers.tf).

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'catalog-info.yaml'
      - '.github/workflows/techdocs-publish.yml'
      - '.github/workflows/self-techdocs-publish.yml'

concurrency:
  group: techdocs-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Generate and publish
    uses: ./.github/workflows/techdocs-publish-oidc.yml
    with:
      entity_ref: default/Component/github-workflows
      techdocs_bucket_name: backstage_techdocs
      oidc_exchange_domain_url: ${{ vars.OIDC_EXCHANGE_DOMAIN_URL }}
      oidc_exchange_client_id: ${{ vars.OIDC_EXCHANGE_CLIENT_ID }}
    secrets:
      oidc_exchange_client_secret: ${{ secrets.OIDC_EXCHANGE_CLIENT_SECRET }}
      oci_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
