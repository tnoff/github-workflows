name: Release workflows

# Replaces self-tag.yml. Each reusable workflow has its own version in
# versions/<name>.version (raised in the PR that changes the workflow, enforced
# by self-ci.yml) and is tagged `<name>-vX.Y.Z` here. A change to one workflow
# therefore no longer moves the version, or the Renovate pin, of the others.
#
# Idempotent: a tag that already exists is skipped, so an unchanged version
# costs nothing. Run it by hand from the Actions tab once after merging to cut
# the initial <name>-v1.0.0 tags.
#
# Not part of the library: the `self-` prefix marks callers, not callees.

on:
  push:
    branches:
      - main
    paths:
      - 'versions/*.version'
  workflow_dispatch:

# Serialise so two quick merges cannot race to the same tag.
concurrency:
  group: self-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Tag and release changed workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Same App token the tag workflow uses: the fleet's rulesets name the App
      # as a bypass actor, and a tag pushed with the default GITHUB_TOKEN
      # triggers no downstream run.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Tag and release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for vfile in versions/*.version; do
            name=$(basename "${vfile}" .version)
            tag="${name}-v$(tr -d '[:space:]' < "${vfile}")"
            if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
              echo "${tag} exists -- skipping"
              continue
            fi
            # Notes list only commits that touched this workflow since its own
            # previous release. --generate-notes would list every PR since the
            # last tag of ANY workflow, which is mostly other workflows' changes.
            prev=$(git tag --list "${name}-v*" --sort=-v:refname | head -n 1)
            notes=$(mktemp)
            if [ -n "${prev}" ]; then
              git log --format='- %s (%h)' "${prev}..HEAD" -- ".github/workflows/${name}.yml" > "${notes}"
            fi
            if [ ! -s "${notes}" ]; then
              echo "Release of \`${name}.yml\`." > "${notes}"
            fi
            git tag "${tag}"
            git push origin "${tag}"
            gh release create "${tag}" --verify-tag --title "${tag}" --notes-file "${notes}"
            echo "Released ${tag}"
          done
