name: Docker build check

# Reusable workflow: build an image on a pull request without pushing it, and
# scan the result for secrets.
#
# GitLab counterparts: /gitlab/buildkit-build-check.yml AND
# /gitlab/trufflehog-image.yml. They are one workflow here, which is the single
# biggest change in this port.
#
# On GitLab those had to be separate jobs, so the built image was exported as a
# `docker save` tarball, uploaded to an OCI Object Storage bucket keyed by
# pipeline ID, and downloaded again by the scan job. That handoff existed only
# because two GitLab jobs are two pods with nothing shared between them. Here
# the image is already in the local daemon, so the scan is another step. The
# IMAGE_HANDOFF_BUCKET, the S3 upload, the download, and the "unset bucket is a
# hard error" guard all cease to exist.
#
# It also halves the job count for image repos, which is what GitHub bills:
# discord-bot's five build jobs plus five scan jobs become five.
#
# The bespoke buildkit setup is gone too. The GitLab template started an
# ephemeral in-job buildkitd against a unix socket (needing a privileged pod)
# and drove it with buildctl; here docker/setup-buildx-action does that. The S3
# layer cache is replaced by GitHub's own cache backend -- which removes
# `--export-cache mode=max`, and with it the reason these builds needed 12-18Gi
# of ephemeral storage: mode=max writes every intermediate layer to disk before
# shipping it.
#
on:
  workflow_call:
    inputs:
      context:
        description: 'Build context directory'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to the Dockerfile, relative to the repo root'
        required: false
        type: string
        default: 'Dockerfile'
      build_args:
        description: 'Newline-separated build args (KEY=value per line)'
        required: false
        type: string
        default: ''
      platform:
        description: >-
          Target platform. Defaults to linux/arm64 to match the cluster, which
          is what the fleet builds for. Paired with an arm64 runner this is a
          native build -- no QEMU, unlike a cross-build on an amd64 runner.
        required: false
        type: string
        default: 'linux/arm64'
      cache:
        description: 'Use the GitHub Actions layer cache'
        required: false
        type: boolean
        default: true
      scan_image:
        description: 'Scan the built image for secrets'
        required: false
        type: boolean
        default: true
      trufflehog_extra_args:
        description: >-
          Extra flags for the image scan. Do NOT pass --fail; the invocation
          below already sets it and trufflehog rejects a repeated flag.
        required: false
        type: string
        default: '--only-verified'
      runner_labels:
        description: >-
          Runner labels as JSON array. ubuntu-24.04-arm is free for public
          repos and builds linux/arm64 natively.
        required: false
        type: string
        default: '["ubuntu-24.04-arm"]'
      allow_fork_prs:
        description: 'Allow fork PRs to run this workflow'
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build and scan
    runs-on: ${{ fromJson(inputs.runner_labels) }}
    if: >-
      inputs.allow_fork_prs ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      # load: true puts the image in the local daemon so the scan below can read
      # it. mode is left at the default (min): mode=max is what made the GitLab
      # builds need 12-18Gi of disk, and it buys nothing for a PR check that
      # throws the result away.
      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platform }}
          build-args: ${{ inputs.build_args }}
          push: false
          load: true
          tags: build-check:${{ github.sha }}
          cache-from: ${{ inputs.cache && 'type=gha' || '' }}
          cache-to: ${{ inputs.cache && 'type=gha,mode=min' || '' }}

      - name: Report image size
        env:
          IMAGE: build-check:${{ github.sha }}
        run: |
          bytes=$(docker image inspect "${IMAGE}" --format '{{.Size}}')
          echo "image size: $((bytes / 1048576)) MB"

      - name: Scan image for secrets
        if: inputs.scan_image
        env:
          EXTRA_ARGS: ${{ inputs.trufflehog_extra_args }}
          IMAGE: build-check:${{ github.sha }}
        run: |
          set -euo pipefail
          # EXTRA_ARGS is intentionally unquoted: it is a flag list, not one arg.
          # shellcheck disable=SC2086
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/trufflesecurity/trufflehog:latest \
            docker --image "${IMAGE}" --fail --no-update ${EXTRA_ARGS}
