name: Startup failure sweep

# Poll the fleet for failures that emit NO event, and report them to #ci-alerts.
#
# WHY THIS EXISTS
#
# notify-failure.yml is event-driven: it hangs off `workflow_run: completed` and
# reports anything that finishes as `failure`. Two failure classes never reach
# it, and both are silent in exactly the way that matters.
#
#   1. STARTUP FAILURES. When a workflow file is invalid -- a bad expression, or
#      a `uses:` whose inputs/secrets do not match the callee's declarations --
#      the run is created with conclusion `startup_failure` and NO job. GitHub
#      emits no `workflow_run` event for it at all. Measured 2026-09-08:
#      personal-website failed at startup at 20:14:05Z and its last
#      `Notify on failure` run was 14:48 the same day; eastbay, discord-bot and
#      enheduanna show the same gap. The notifier's `if:` never got the chance
#      to skip, because the workflow was never triggered.
#
#      That is the worst-shaped failure available: the pipeline does nothing AND
#      says nothing. It cost the fleet 24 dead `Release` runs across 9 repos
#      between 2026-09-04 and 2026-09-08 before a human happened to look.
#
#   2. A FAILED NOTIFIER. notify-failure.yml excludes runs named
#      `Notify on failure` so a broken notifier cannot notify about itself in a
#      loop. The stated cost, recorded in the docs corpus under
#      github-canonical-migration.md as accepted risk, is that a broken notifier
#      is silent. Polling is what makes it not silent: this run is a different
#      workflow, so it can say what the notifier could not.
#
#   3. DEAD SCHEDULES. A `schedule:` workflow that stops firing produces no run,
#      so there is nothing to fail and nothing to report. Two ways it happens:
#      GitHub turns scheduled workflows off after 60 days without repo activity
#      (workflow state `disabled_inactivity`, read straight from the API), or
#      the cron simply never fires. The second is judged by age of the last
#      scheduled run. The threshold is sized from the cron's *tier*, not its
#      nominal interval, because GitHub drops most hourly slots (see below):
#      12h hourly, 24h for sub-daily, 72h daily, 5d weekday-only, 14d weekly,
#      45d monthly. This only catches a schedule that is properly dead, never
#      one that is merely late; that is the price of the dropped slots.
#
#      Unlike the two above, a dead schedule is a CONDITION, not an event, so
#      the high-water mark cannot dedupe it. A second cache file records when
#      each was last alerted and re-alerts once a day while it stays dead. Like
#      the mark, a cache miss only costs a duplicate, never a gap.
#
# Neither of the first two is fixable with another event subscription. There is no event. Polling
# is not the lazy option here, it is the only option.
#
# WHY IT LIVES HERE, and is not `self-*` and not `workflow_call`
#
# Same reasoning as fleet-mirror.yml, which this deliberately mirrors: it acts on
# the fleet rather than on this repo, it runs in exactly one place, it takes no
# per-repo configuration, and this repo is public so an hourly cron is free.
# A per-repo version would need 28 crons and would bill the three private repos
# (terraform, terraform-admin, docs) against budgets that cannot absorb it.
#
# NO REPO LIST. The fleet is whatever the tnoff-ci App is installed on, read
# from /installation/repositories. A repo added to the App is swept from the
# next hour; nothing to maintain and nothing to go stale.
#
# THE LOOKBACK IS SIZED FROM MEASURED CRON BEHAVIOUR, NOT FROM THE CRON
#
# This shipped with a 70-minute lookback against an hourly cron, on the
# reasoning that a 10-minute overlap costs a duplicate embed while state that
# expires costs a gap. The pricing was right. The premise was not: **an hourly
# cron does not run hourly.**
#
# Measured 2026-09-09 over 8 days of `fleet-mirror.yml`, also `cron: '17 * * * *'`
# in this same repo: 50 scheduled runs where 190 were due, so **74% of slots are
# dropped**. Gaps ran min 2.0h, median 4.0h, max 6.0h -- and **50 of 50 exceeded
# 70 minutes**. The original design would therefore have missed very nearly every
# startup failure while reporting itself healthy, which is precisely the shape of
# bug this workflow exists to catch.
#
# So: a lookback wider than the worst observed gap (8h default vs 6h max), plus a
# high-water mark to suppress the duplicates that width would otherwise cause.
# The state is strictly an OPTIMISATION and is fail-safe by construction -- it can
# only ever remove duplicates, never create a gap. A cache miss falls back to
# reporting the whole window. That ordering is what makes state acceptable here
# when it was not before.
#
# It also reports its own coverage loss: if the stored mark is older than the
# window reaches, the sweep says how much time went unswept rather than quietly
# resuming.

on:
  schedule:
    # Offset from fleet-mirror's :17 so the two fleet sweeps do not contend for
    # the same API budget on the same minute.
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      lookback_minutes:
        description: >-
          How far back to look, in minutes. Default 480 (8h) is sized from the
          measured 6h worst-case gap between scheduled runs, not from the cron.
        required: false
        type: string
        default: '480'
      dry_run:
        description: 'Report findings in the log without posting to Discord'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Two overlapping sweeps would double-report. Never cancel one mid-post.
  group: startup-failure-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep the fleet
    runs-on: ubuntu-24.04
    outputs:
      findings: ${{ steps.sweep.outputs.findings }}
      count: ${{ steps.sweep.outputs.count }}
    steps:
      # Installation-wide token, not the default GITHUB_TOKEN, which is scoped
      # to this repo alone and could not read another repo's runs.
      #
      # Needs `Actions: read` and `Contents: read` on the App (the latter to
      # read each workflow file for its cron). Public repos answer
      # /actions/runs to any valid token, so a missing permission shows up ONLY
      # on the three private repos -- which is why an unreadable repo below is a
      # hard failure with the permission named, rather than a skip. A sweep that
      # quietly covered 25 of 28 repos would be worse than one that does not run.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # High-water mark from the previous sweep. Cache rather than a repo
      # variable because writing a variable needs a permission the App does not
      # carry, and because a miss here is harmless by design: no mark means the
      # full window is reported, which is duplicates rather than silence.
      #
      # The key is unique per run so each sweep writes a fresh entry; the
      # restore-keys prefix returns the most recent one. Entries evict after 7
      # days unused, and the sweep runs every few hours, so it stays warm.
      - name: Restore the high-water mark
        id: hwm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .sweep-hwm
          key: startup-sweep-hwm-${{ github.run_id }}
          restore-keys: startup-sweep-hwm-

      # When each dead schedule was last alerted, so a standing condition
      # re-alerts daily instead of every sweep. Same fail-safe as the mark: a
      # miss means a duplicate alert, never a missed one.
      - name: Restore the dead-schedule alert state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .sweep-dead
          key: startup-sweep-dead-${{ github.run_id }}
          restore-keys: startup-sweep-dead-

      - name: Sweep
        id: sweep
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LOOKBACK: ${{ inputs.lookback_minutes || '480' }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          WINDOW=$(date -u -d "${LOOKBACK} minutes ago" +%Y-%m-%dT%H:%M:%SZ)

          # The floor is the LATER of the window and the previous mark, so a
          # finding already reported is not reported again. ISO-8601 UTC strings
          # sort lexicographically, which is why a plain string compare is safe.
          SINCE="${WINDOW}"
          if [ -s .sweep-hwm ]; then
            HWM=$(tr -d '[:space:]' < .sweep-hwm)
            if [[ "${HWM}" > "${WINDOW}" ]]; then
              SINCE="${HWM}"
            else
              # The window did not reach back to where the last sweep stopped:
              # that interval was never swept by anyone. Say so -- silently
              # resuming is how a gap becomes invisible.
              echo "::warning::Coverage gap: the last sweep marked ${HWM} but this" \
                   "window only reaches ${WINDOW}. Runs between those times were" \
                   "never swept. Scheduled runs are being dropped more than the" \
                   "${LOOKBACK}-minute lookback allows for; widen it."
            fi
          else
            echo "no stored mark (first run or evicted cache): reporting the whole window," \
                 "which may duplicate alerts already sent"
          fi

          echo "sweeping for runs since ${SINCE} (window ${LOOKBACK}m from ${WINDOW})"
          echo

          findings=$(mktemp)
          unreadable=$(mktemp)

          # /installation/repositories is what an installation token can list;
          # it IS the fleet definition. Paginated by --paginate because the
          # default page size would silently truncate at 30.
          repo_rows=$(gh api --paginate /installation/repositories \
            --jq '.repositories[] | select(.archived | not) | [.full_name, .default_branch] | @tsv')
          repos=$(printf '%s\n' "${repo_rows}" | cut -f1)
          declare -A default_branch
          while IFS=$'\t' read -r name branch; do
            default_branch["${name}"]="${branch}"
          done <<< "${repo_rows}"
          echo "fleet: $(printf '%s\n' "${repos}" | wc -l) repos"
          echo

          # Dead-schedule bookkeeping. NOW_EPOCH anchors every age below.
          NOW_EPOCH=$(date -u +%s)
          REALERT_SECONDS=86400
          [ -f .sweep-dead ] || : > .sweep-dead
          : > .sweep-dead.new

          # How stale a scheduled workflow may get before it counts as dead.
          # A heuristic on the cron's shape, not a cron parser; each tier is
          # several times its nominal gap because slots are dropped, not late.
          cron_threshold() {
            local m h dom mon dow
            read -r m h dom mon dow _ <<< "$1"
            if [[ "${dom}${mon}" != '**' ]]; then
              echo $(( 45 * 86400 ))                      # monthly or rarer
            elif [[ "${dow}" != '*' ]]; then
              if [[ "${dow}" =~ [-,] ]]; then
                echo $(( 5 * 86400 ))                     # weekdays: spans a weekend
              else
                echo $(( 14 * 86400 ))                    # weekly
              fi
            elif [[ "${h}" == *'*'* && "${h}" != */* && "${h}" != *[-,]* ]]; then
              echo $(( 12 * 3600 ))                       # hourly: measured 6h max gap
            elif [[ "${h}" =~ [*/,-] ]]; then
              echo $(( 24 * 3600 ))                       # several times a day
            else
              echo $(( 72 * 3600 ))                       # daily
            fi
          }

          # Record one dead schedule, unless it was alerted inside the last day.
          # $1 key  $2 repo  $3 name  $4 url  $5 detail
          report_dead() {
            local prev
            prev=$(awk -F'\t' -v k="$1" '$1 == k { print $2 }' .sweep-dead)
            if [ -n "${prev}" ] && [ $(( NOW_EPOCH - prev )) -lt "${REALERT_SECONDS}" ]; then
              printf '%s\t%s\n' "$1" "${prev}" >> .sweep-dead.new
              printf '%-30s %s dead (already alerted)\n' "$2" "$3"
              return
            fi
            printf '%s\t%s\n' "$1" "${NOW_EPOCH}" >> .sweep-dead.new
            jq -nc --arg repo "$2" --arg wf "$3" --arg url "$4" --arg detail "$5" \
                   --arg branch "${default_branch[$2]}" --arg now "${NOW}" '
              {repo: $repo, workflow: $wf, branch: $branch, actor: "n/a", sha: "n/a",
               url: $url, created: $now, kind: "dead_schedule", detail: $detail}
            ' >> "${findings}"
          }

          for full in ${repos}; do
            # Branch on the EXIT STATUS, never on whether stdout looks empty:
            # gh writes its own errors to stdout as well as stderr, so a 403
            # body would otherwise be parsed as data.
            if ! runs=$(gh api "repos/${full}/actions/runs?status=startup_failure&per_page=30" 2>&1); then
              printf '%s\n' "${full}" >> "${unreadable}"
              printf '%-30s UNREADABLE\n' "${full}"
              continue
            fi

            printf '%s' "${runs}" | jq -c --arg since "${SINCE}" --arg repo "${full}" '
              .workflow_runs[]
              | select(.created_at >= $since)
              | {repo: $repo, workflow: .name, branch: .head_branch,
                 actor: (.actor.login // "unknown"), sha: .head_sha,
                 url: .html_url, created: .created_at, kind: "startup_failure"}
            ' >> "${findings}"

            # The second blind spot: notify-failure.yml excluding itself. A 404
            # here just means the repo has no notifier, which is not an error.
            nf_path="repos/${full}/actions/workflows/notify-failure.yml/runs"
            if nf=$(gh api "${nf_path}?status=failure&per_page=10" 2>/dev/null); then
              printf '%s' "${nf}" | jq -c --arg since "${SINCE}" --arg repo "${full}" '
                .workflow_runs[]
                | select(.created_at >= $since)
                | {repo: $repo, workflow: .name, branch: .head_branch,
                   actor: (.actor.login // "unknown"), sha: .head_sha,
                   url: .html_url, created: .created_at, kind: "dead_notifier"}
              ' >> "${findings}"
            fi

            # The third blind spot: a scheduled workflow that stopped firing.
            if ! wfs=$(gh api --paginate "repos/${full}/actions/workflows" --jq '
                  .workflows[]
                  | select(.path | startswith(".github/workflows/"))
                  | [.id, .path, .name, .state, .created_at, .html_url] | @tsv' 2>&1); then
              printf '%s (workflow list)\n' "${full}" >> "${unreadable}"
              continue
            fi
            while IFS=$'\t' read -r wf_id wf_path wf_name wf_state wf_created wf_url; do
              [ -n "${wf_id}" ] || continue
              key="${full}:${wf_path}"

              if [ "${wf_state}" = disabled_inactivity ]; then
                report_dead "${key}" "${full}" "${wf_name}" "${wf_url}" \
                  "Scheduled workflow was DISABLED by GitHub after 60 days without repository activity, so its cron no longer fires. Re-enable it in the Actions tab (or push a commit and re-enable)."
                continue
              fi
              [ "${wf_state}" = active ] || continue

              if ! src=$(gh api -H 'Accept: application/vnd.github.raw+json' \
                    "repos/${full}/contents/${wf_path}" 2>&1); then
                printf '%s (workflow contents)\n' "${full}" >> "${unreadable}"
                continue
              fi
              # Anchored to line start so a commented-out cron does not count.
              threshold=""
              while IFS= read -r cron; do
                [ -n "${cron}" ] || continue
                t=$(cron_threshold "${cron}")
                if [ -z "${threshold}" ] || [ "${t}" -lt "${threshold}" ]; then
                  threshold="${t}"
                  cron_used="${cron}"
                fi
              done < <(printf '%s\n' "${src}" \
                | sed -nE "s/^[[:space:]]*-?[[:space:]]*cron:[[:space:]]*['\"]?([^'\"#]*[^'\"# ]).*/\1/p")
              [ -n "${threshold}" ] || continue   # no schedule trigger

              if ! last=$(gh api "repos/${full}/actions/workflows/${wf_id}/runs?event=schedule&per_page=1" \
                    --jq '.workflow_runs[0].created_at // empty' 2>&1); then
                printf '%s (workflow runs)\n' "${full}" >> "${unreadable}"
                continue
              fi
              if [ -n "${last}" ]; then
                ref="${last}"; seen="last scheduled run ${last}"
              else
                ref="${wf_created}"; seen="no scheduled run has ever been recorded (workflow first seen ${wf_created})"
              fi
              age=$(( NOW_EPOCH - $(date -u -d "${ref}" +%s) ))
              printf '%-30s %-28s age %6dh limit %4dh\n' "${full}" "${wf_path##*/}" \
                $(( age / 3600 )) $(( threshold / 3600 ))
              if [ "${age}" -gt "${threshold}" ]; then
                report_dead "${key}" "${full}" "${wf_name}" "${wf_url}" \
                  "Scheduled workflow looks DEAD: ${seen}, over the $(( threshold / 3600 ))h limit for cron '${cron_used}'. GitHub drops many slots, so this is sized well past normal lateness. Check the workflow is enabled and the default branch carries the schedule."
              fi
            done <<< "${wfs}"
          done

          # Persist alert state only for a real run: a hand-dispatched dry run
          # must not mark a dead schedule as already reported.
          if [ "${EVENT_NAME}" = schedule ] || [ "${DRY_RUN}" = false ]; then
            mv .sweep-dead.new .sweep-dead
          fi

          total=$(wc -l < "${findings}")
          echo
          echo "findings: ${total}"
          jq -r '"  \(.kind)  \(.repo)  \(.workflow)  \(.url)"' < "${findings}" || true

          # A matrix caps at 256 jobs, and a fleet-wide breakage can exceed that.
          # Truncate LOUDLY -- a silent cap reads as "everything is reported".
          CAP=20
          if [ "${total}" -gt "${CAP}" ]; then
            dropped=$(( total - CAP ))
            echo "::warning::${total} findings this sweep, reporting the ${CAP} most recent;" \
                 "${dropped} not posted to Discord. The full list is in this log."

          fi
          payload=$(jq -sc --argjson cap "${CAP}" 'sort_by(.created) | reverse | .[0:$cap]' < "${findings}")

          {
            echo "findings=${payload}"
            echo "count=$(printf '%s' "${payload}" | jq 'length')"
          } >> "${GITHUB_OUTPUT}"

          # The scan boundary, not the newest finding: everything up to NOW has
          # now been looked at, whether or not it produced a finding.
          printf '%s\n' "${NOW}" > .sweep-hwm

          # Deliberately last: report what WAS found before failing on what
          # could not be read, so a permission gap never costs a real alert.
          if [ -s "${unreadable}" ]; then
            n_bad=$(wc -l < "${unreadable}")
            bad_list=$(tr '\n' ' ' < "${unreadable}" | sed 's/ *$//')
            echo "::error::Could not read Actions runs for ${n_bad} repo(s): ${bad_list}." \
                 "The tnoff-ci App needs Actions: read and Contents: read -- public repos" \
                 "answer without them, private ones do not. This run's own failure reaches #ci-alerts via" \
                 "notify-failure.yml."
            exit 1
          fi

      # `always()` so a sweep that fails on an unreadable repo still records the
      # ground it covered. Losing the mark there would re-report every finding
      # in the window on the next run, turning one permission error into a burst
      # of duplicate alerts.
      - name: Save the high-water mark
        if: always() && hashFiles('.sweep-hwm') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .sweep-hwm
          key: startup-sweep-hwm-${{ github.run_id }}

      - name: Save the dead-schedule alert state
        if: always() && hashFiles('.sweep-dead') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .sweep-dead
          key: startup-sweep-dead-${{ github.run_id }}

  notify:
    name: Report to Discord
    needs: sweep
    # A hand-dispatched run defaults to reporting in the log only, so "just show
    # me" is the safe thing to type. A scheduled run is always the real thing.
    if: >-
      needs.sweep.outputs.count != '0' &&
      (github.event_name == 'schedule' || inputs.dry_run == false)
    strategy:
      # One bad webhook post must not suppress the rest of the findings.
      fail-fast: false
      matrix:
        finding: ${{ fromJson(needs.sweep.outputs.findings) }}
    uses: ./.github/workflows/discord-notify.yml
    with:
      # Every field describes the FAILING run, not this sweep. Without the
      # source_* overrides a reusable workflow reports its caller's context,
      # which here would name github-workflows on every single alert.
      source_repo: ${{ matrix.finding.repo }}
      source_run_url: ${{ matrix.finding.url }}
      source_workflow: ${{ matrix.finding.workflow }}
      source_branch: ${{ matrix.finding.branch }}
      source_actor: ${{ matrix.finding.actor }}
      source_sha: ${{ matrix.finding.sha }}
      message: >-
        ${{ matrix.finding.kind == 'startup_failure'
        && 'Failed at STARTUP: the workflow file is invalid, so no job ran and
        no check reported. GitHub emits no workflow_run event for this, which is
        why it comes from the periodic sweep and not from notify-failure.yml. The
        usual cause is a uses: whose inputs or secrets no longer match the
        pinned callee.'
        || matrix.finding.kind == 'dead_schedule' && matrix.finding.detail
        || 'The failure NOTIFIER itself failed in this repo. It excludes its own
        runs to avoid a loop, so nothing else would have said so -- and while it
        is broken, other failures there may also be going unreported.' }}
    secrets:
      discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
