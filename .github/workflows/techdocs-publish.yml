name: Publish TechDocs

# Reusable workflow: build a component's mkdocs site with @techdocs/cli and
# publish it straight to an S3-compatible TechDocs storage bucket.
#
# This is the "recommended deployment approach" from Backstage's own docs
# (see the TechDocs how-to-guides, "migrate from basic to recommended
# deployment approach") -- CI builds and publishes, the backend only ever
# reads. That is not optional for this fleet's backstage: it runs with
# techdocs.builder: external because the pod has no Docker available to
# generate on demand (docker-apps + tnoff/backstage#20). GitHub-hosted
# runners DO have Docker by default, which is why `techdocs-cli generate`'s
# default docker-based mkdocs build works here with no extra setup.
#
# Ported out of tnoff/terraform-modules#64, its first caller, once a second
# repo needed the same handful of steps.
#
# Usage in a consumer repo (see tnoff/terraform-modules for a full example):
#
#   on:
#     push:
#       branches: [main]
#       paths: ['docs/**', 'mkdocs.yml', 'catalog-info.yaml']
#
#   jobs:
#     publish:
#       uses: tnoff/github-workflows/.github/workflows/techdocs-publish.yml@<sha>
#       with:
#         entity_ref: default/Component/<name>
#       secrets:
#         techdocs_s3_access_key_id: ${{ secrets.TECHDOCS_S3_ACCESS_KEY_ID }}
#         techdocs_s3_secret_access_key: ${{ secrets.TECHDOCS_S3_SECRET_ACCESS_KEY }}
#         techdocs_s3_bucket_name: ${{ secrets.TECHDOCS_S3_BUCKET_NAME }}
#         techdocs_s3_endpoint: ${{ secrets.TECHDOCS_S3_ENDPOINT }}
#         techdocs_s3_region: ${{ secrets.TECHDOCS_S3_REGION }}

on:
  workflow_call:
    inputs:
      entity_ref:
        description: >-
          Backstage entity uid, namespace/Kind/name (case-sensitive). Example:
          default/Component/terraform-modules. Passed straight to
          `techdocs-cli publish --entity`.
        required: true
        type: string
      legacy_copy_readme_to_index:
        description: >-
          Pass --legacyCopyReadmeMdToIndexMd to `techdocs-cli generate`, which
          copies docs/README.md to docs/index.md before building. Defaults
          false because it is actively harmful whenever docs/README.md
          already exists: mkdocs treats the resulting index.md/README.md pair
          as a conflict and silently drops README.md from the build, which
          leaves every link that points at README.md -- including a
          mkdocs.yml nav entry -- pointing at a page that was never
          published. mkdocs already falls back to README.md as the implicit
          homepage on its own when no index.md exists at all, so this flag
          is only for the genuinely rare case of a docs/ with neither
          index.md nor README.md.
        required: false
        type: boolean
        default: false
      techdocs_cli_version:
        description: 'Pinned @techdocs/cli version, passed to npx as @techdocs/cli@<version>'
        required: false
        type: string
        default: '1.12.0'
      runner_labels:
        description: 'Runner labels as JSON array (e.g., ["self-hosted", "oke"])'
        required: false
        type: string
        default: '["ubuntu-24.04"]'
    secrets:
      techdocs_s3_access_key_id:
        required: true
      techdocs_s3_secret_access_key:
        required: true
      techdocs_s3_bucket_name:
        required: true
      techdocs_s3_endpoint:
        required: true
      techdocs_s3_region:
        required: true

jobs:
  publish:
    name: Generate and publish
    runs-on: ${{ fromJson(inputs.runner_labels) }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Generate docs
        env:
          CLI_VERSION: ${{ inputs.techdocs_cli_version }}
          LEGACY_COPY: ${{ inputs.legacy_copy_readme_to_index }}
        run: |
          set -euo pipefail
          if [ "${LEGACY_COPY}" = "true" ]; then
            npx --yes "@techdocs/cli@${CLI_VERSION}" generate --legacyCopyReadmeMdToIndexMd
          else
            npx --yes "@techdocs/cli@${CLI_VERSION}" generate
          fi

      - name: Publish docs
        env:
          CLI_VERSION: ${{ inputs.techdocs_cli_version }}
          ENTITY_REF: ${{ inputs.entity_ref }}
          AWS_ACCESS_KEY_ID: ${{ secrets.techdocs_s3_access_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.techdocs_s3_secret_access_key }}
          AWS_REGION: ${{ secrets.techdocs_s3_region }}
          BUCKET_NAME: ${{ secrets.techdocs_s3_bucket_name }}
          ENDPOINT: ${{ secrets.techdocs_s3_endpoint }}
        run: >-
          npx --yes "@techdocs/cli@${CLI_VERSION}" publish
          --publisher-type awsS3
          --storage-name "${BUCKET_NAME}"
          --awsEndpoint "${ENDPOINT}"
          --awsS3ForcePathStyle
          --entity "${ENTITY_REF}"
