name: Renovate

# Reusable workflow: run self-hosted Renovate against the calling repository.
#
# Self-hosted rather than the Mend GitHub App, so the tuned config in each
# repo's renovate.json keeps its grouping, minimumReleaseAge and automerge
# scoping. Run it on a schedule.
#
# GitLab counterpart: /gitlab/renovate.yml.
#
# Two things that template needed and this one does not:
#
#   * RENOVATE_ENDPOINT / RENOVATE_PLATFORM=gitlab. Platform is github here.
#   * GITHUB_COM_TOKEN. On GitLab, Renovate needed a *separate* github.com
#     token purely to fetch release notes, and the fleet spent a long outage on
#     that variable being undefined -- GitLab expands an undefined variable to
#     an empty string, Renovate presents the empty token, and github.com 401s
#     every release lookup (see terraform-admin!37, docs!87). When the platform
#     *is* github, the platform token covers release notes and the whole failure
#     mode disappears. Do not reintroduce it.
#
#     CAVEAT, unverified: that reasoning was written when the platform token
#     was a PAT. It is now a GitHub App installation token, which is scoped to
#     the installation's repositories -- and changelogs are fetched from repos
#     OUTSIDE it (actions/checkout, pytest, and so on). If release notes stop
#     rendering in PR bodies after this change, that is the cause, and
#     GITHUB_COM_TOKEN comes back for changelogs only. Check a PR body before
#     rolling this past the first repo: the failure is cosmetic and silent, so
#     nothing else will report it.
#
# Usage in a consumer repo:
#
#   on:
#     schedule:
#       - cron: '10 3 * * 6'
#     workflow_dispatch:
#
#   jobs:
#     renovate:
#       uses: tnoff/github-workflows/.github/workflows/renovate.yml@<sha>
#       secrets:
#         app_id: ${{ secrets.CI_APP_ID }}
#         app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}
#
on:
  workflow_call:
    inputs:
      runner_labels:
        description: 'Runner labels as JSON array (e.g., ["self-hosted", "oke"])'
        required: false
        type: string
        default: '["ubuntu-24.04"]'
      log_level:
        description: 'Renovate LOG_LEVEL (debug when diagnosing a run)'
        required: false
        type: string
        default: 'info'
      allowed_commands:
        description: >-
          JSON array of regexes allowlisting repo-level postUpgradeTasks
          commands. postUpgrade shell is refused unless allowlisted in the
          self-hosted (global) config -- a repo's renovate.json cannot authorize
          its own commands. The option is `allowedCommands`; it was renamed from
          `allowedPostUpgradeCommands` in Renovate v40, so the old env var is
          silently ignored and leaves the allowlist empty. Repos without a
          matching script simply never match.
        required: false
        type: string
        default: '["^bash ci/renovate-terraform-docs\\.sh$"]'
      timeout_minutes:
        description: >-
          Backstop, not a budget. Renovate itself finishes in 1.5-12 min across
          these repos; this only caps a wedged run.
        required: false
        type: number
        default: 30
    secrets:
      app_id:
        description: 'App ID of the tnoff-ci GitHub App (CI_APP_ID).'
        required: true
      app_private_key:
        description: >-
          Private key PEM of the tnoff-ci GitHub App (CI_APP_PRIVATE_KEY).
          Renovate authenticates as the App rather than as tnoff-robot, which
          is what lets that account hold no write access on GitHub at all --
          an App's permissions come from its installation, not from
          collaborator status.
        required: true

jobs:
  renovate:
    name: Renovate
    runs-on: ${{ fromJson(inputs.runner_labels) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    steps:
      # Renovate authenticates as the tnoff-ci App, not as tnoff-robot. An
      # App's access comes from its installation rather than from collaborator
      # status, so the bot account needs no write permission on GitHub at all.
      #
      # gitAuthor is pinned in renovate/default-github.json, which is what
      # makes this swap invisible: with it unset Renovate derives its commit
      # author from the authenticated account, and changing the token would
      # re-author its commits and orphan every branch it already owns.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Renovate
        uses: renovatebot/github-action@5402b206248e5a8c8427a15102702eb9c1793efc  # v46.2.4
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_COMMANDS: ${{ inputs.allowed_commands }}
          LOG_LEVEL: ${{ inputs.log_level }}
