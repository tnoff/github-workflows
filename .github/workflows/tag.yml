name: Tag

# Reusable workflow: tag a commit from a version file.
#
# GitLab counterpart: /gitlab/tag.yml. Two mechanical differences:
#
#   * The dotenv artifact (build.env carrying VERSION / TAG_CREATED /
#     TAG_EXISTS into the release job) becomes workflow outputs. Same handoff,
#     no artifact.
#   * Tag existence is checked with `git ls-remote`, unchanged -- it is the
#     cheapest check that does not depend on local tag state.
#
# ---------------------------------------------------------------------------
# push_token, and why the default GITHUB_TOKEN will not do
# ---------------------------------------------------------------------------
# A tag pushed with the default GITHUB_TOKEN triggers no downstream workflow
# run. More importantly for repos with a branch ruleset: the token must belong
# to an identity the ruleset lets through. The fleet's rulesets bypass the
# repository-admin role, so an admin's PAT works and a write-scoped bot token
# does not.
#
on:
  workflow_call:
    inputs:
      version_file:
        description: 'Path to the version file'
        required: false
        type: string
        default: 'VERSION'
      version_file_type:
        description: "File type: 'plain' or 'json'"
        required: false
        type: string
        default: 'plain'
      version_json_key:
        description: 'Key holding the version when version_file_type is json'
        required: false
        type: string
        default: 'version'
      gate_on_fragments:
        description: >-
          Set true on repos wired for assemble-changelog. When changelog
          fragments are still pending, this job defers (tag_created=false) so
          assemble-changelog folds and pushes first; that push fires a
          follow-up run where the fragment directory is empty, this gate
          passes, and tag/release run against the assembled changelog.
        required: false
        type: boolean
        default: false
      changelog_dir:
        description: 'Directory of unassembled fragments; only read when gate_on_fragments is true'
        required: false
        type: string
        default: 'changelog.d'
      runner_labels:
        description: 'Runner labels as JSON array (e.g., ["self-hosted", "oke"])'
        required: false
        type: string
        default: '["ubuntu-24.04"]'
    secrets:
      push_token:
        description: 'PAT used to push the tag. See the note above.'
        required: true
    outputs:
      version:
        description: 'The tag, with a leading v (empty when deferred)'
        value: ${{ jobs.tag.outputs.version }}
      tag_created:
        description: 'Whether a new tag was pushed (true/false)'
        value: ${{ jobs.tag.outputs.tag_created }}
      tag_exists:
        description: 'Whether the tag already existed (true/false)'
        value: ${{ jobs.tag.outputs.tag_exists }}

jobs:
  tag:
    name: Tag
    runs-on: ${{ fromJson(inputs.runner_labels) }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag_created: ${{ steps.tag.outputs.tag_created }}
      tag_exists: ${{ steps.tag.outputs.tag_exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.push_token }}

      - name: Tag
        id: tag
        env:
          VERSION_FILE: ${{ inputs.version_file }}
          VERSION_FILE_TYPE: ${{ inputs.version_file_type }}
          VERSION_JSON_KEY: ${{ inputs.version_json_key }}
          GATE_ON_FRAGMENTS: ${{ inputs.gate_on_fragments }}
          CHANGELOG_DIR: ${{ inputs.changelog_dir }}
        run: |
          set -euo pipefail

          emit() {
            {
              echo "version=${1}"
              echo "tag_created=${2}"
              echo "tag_exists=${3}"
            } >> "$GITHUB_OUTPUT"
          }

          # Pre-fold pipeline: fragments still pending, so defer and let
          # assemble-changelog fold and push first.
          if [ "${GATE_ON_FRAGMENTS}" = "true" ] && ls "${CHANGELOG_DIR}"/*.md >/dev/null 2>&1; then
            echo "Changelog fragments pending in ${CHANGELOG_DIR} -- deferring tag to the post-assemble run."
            emit "" "false" "false"
            exit 0
          fi

          if [ "${VERSION_FILE_TYPE}" = "json" ]; then
            VERSION="v$(jq -r --arg key "${VERSION_JSON_KEY}" '.[$key]' "${VERSION_FILE}" | tr -d '[:space:]')"
          else
            VERSION="v$(tr -d '[:space:]' < "${VERSION_FILE}")"
          fi

          if git ls-remote --tags origin "refs/tags/${VERSION}" | grep -q .; then
            echo "Tag ${VERSION} already exists -- skipping"
            emit "${VERSION}" "false" "true"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${VERSION}"
          git push origin "${VERSION}"
          echo "Tag ${VERSION} created"
          emit "${VERSION}" "true" "false"
