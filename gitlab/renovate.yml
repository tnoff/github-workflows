# Reusable GitLab CI template for running Renovate dependency updates.
#
# Renovate opens MRs to update dependencies based on the repo's renovate.json config.
# Run this on a scheduled pipeline — daily or weekly is typical.
#
# Usage in consumer repo's .gitlab-ci.yml:
#
#   include:
#     - project: 'org/ci-workflows'
#       ref: main
#       file: '/gitlab/renovate.yml'
#
#   renovate:
#     extends: .renovate
#     rules:
#       - if: $CI_PIPELINE_SOURCE == "schedule"
#
# Required CI variables (set under Settings → CI/CD → Variables):
#   RENOVATE_TOKEN      GitLab PAT with api scope — used to open/update MRs
#
# Optional CI variables:
#   GITHUB_COM_TOKEN    GitHub PAT (no scopes needed beyond public read) — lets
#                       Renovate fetch release notes from github.com when
#                       updating dependencies whose source/changelog lives there.
#                       Without it, MR bodies show "Release Notes retrieval for
#                       this MR were skipped because no github.com credentials
#                       were available."
#
.renovate:
  image: docker.io/renovate/renovate:43
  # Backstop, not a budget. If the build container dies mid-run (e.g. OOMKilled),
  # the Kubernetes executor's attach strategy does not detect it — the job emits
  # nothing further and burns the full timeout before failing. Renovate itself
  # finishes in 1.5-12min across these repos, but the pod can sit Pending for
  # 8-20min waiting on an A1 ci node to cold-start from zero, and that wait counts
  # against this timeout. 30m clears the worst observed cold start with headroom
  # while capping a wedged job at half an hour instead of a full hour.
  timeout: 30m
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_TOKEN: $RENOVATE_TOKEN
    GITHUB_COM_TOKEN: $GITHUB_COM_TOKEN
    LOG_LEVEL: info
    # Allowlist for repo-level postUpgradeTasks commands. postUpgrade shell is
    # refused unless allowlisted in the self-hosted (global) config — a repo's
    # renovate.json cannot authorize its own commands. Scoped by regex to the
    # terraform-docs regen helper; repos without that script simply never match.
    # Option is `allowedCommands` (env RENOVATE_ALLOWED_COMMANDS); it was renamed
    # from `allowedPostUpgradeCommands` in Renovate v40, so the old env var is
    # silently ignored on the :43 image (leaves the allowlist empty → refused).
    RENOVATE_ALLOWED_COMMANDS: '["^bash ci/renovate-terraform-docs\\.sh$"]'
  script:
    - renovate $CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME
