# This file carries BOTH halves of the changelog-fragment flow:
#
#   .assemble-changelog      hidden; the consumer instantiates it. Folds
#                            fragments into CHANGELOG_FILE on the default
#                            branch and pushes back.
#   changelog-fragment-check CONCRETE; runs automatically in any repo that
#                            includes this file, no instantiation needed.
#                            Fails a merge request that adds a fragment
#                            without bumping the version file.
#
# The check is deliberately a concrete job rather than a hidden template, which
# is the one place this repo departs from its own convention. It is a guard, and
# a guard every consumer has to remember to wire up is a guard that is missing
# from whichever repo forgot. Including the file is the opt-in.
#
# To disable it in a consumer, redefine the job there:
#
#   changelog-fragment-check:
#     rules:
#       - when: never
#
# stage: .pre is deliberate too — it is a GitLab built-in that exists in every
# pipeline, so the concrete job cannot break a consumer whose stage list happens
# not to contain the stage this file picked. It also fails before any build job
# spends time.
#
# Reusable GitLab CI template that assembles accumulated changelog *fragments*
# (written by /gitlab/bump-version.yml with BUMP_CHANGELOG=true) into a
# Keep-a-Changelog CHANGELOG_FILE section for the current VERSION, deletes the
# fragments, and pushes the result back to the default branch.
#
# Why fragments: prepending to a shared CHANGELOG.md on every MR conflicts when
# multiple MRs land in one run. Instead each MR drops changelog.d/<slug>.md
# (disjoint files, never conflict); this job folds them together once, at
# release time, when there is only ever a single default-branch pipeline in
# flight (so the push-back is not subject to the same concurrency).
#
# Idempotent: if CHANGELOG_DIR has no fragments, the job exits cleanly without
# committing. Because the assembling commit is a fresh push to the default
# branch, it triggers a follow-up pipeline whose CHANGELOG_DIR is now empty.
#
# Guarded: the job FAILS if CHANGELOG_FILE already has a section for the current
# VERSION while fragments are still pending. That means the change that added
# them never bumped VERSION_FILE, and folding would file it under an already
# released (and already tagged) version — which also makes the downstream tag
# job skip, so the change would ship with no release at all. See the block
# around VERSION_RE below.
#
# INTEGRATION (decided — option (a); see the docs
# "renovate-version-changelog-conflicts" project): tag/release must observe the
# *assembled* CHANGELOG, not the pre-fold tree. In the same pipeline, later jobs
# still see the old checkout, so tag/release run on the FOLLOW-UP pipeline once
# fragments are drained. Wire this by setting GATE_ON_FRAGMENTS=true on the .tag
# job (see /gitlab/tag.yml): while fragments are pending it defers with
# TAG_CREATED=false (and .release skips in turn); the fold push below then fires
# a follow-up pipeline where CHANGELOG_DIR is empty and tag/release proceed
# against the assembled tree.
#
# REQUIRES GITLAB_PUSH_TOKEN (a PAT/deploy token with write_repository), NOT the
# default CI_JOB_TOKEN. GitLab's infinite-loop guard suppresses pipelines for
# CI_JOB_TOKEN pushes, so under CI_JOB_TOKEN the fold push would NOT trigger the
# follow-up pipeline — tag/release would never fire and no release is cut. Set
# GITLAB_PUSH_TOKEN on every repo that enables this flow.
#
# Do NOT wire tag/release to run unconditionally alongside this job (i.e. without
# GATE_ON_FRAGMENTS) or they will tag/release the pre-fold commit.
#
# FAILURE NOTIFICATION is NOT this template's job — do not re-add one. A failed
# assemble is reported to #ci-alerts by the `GitLab CI job failed after final
# retry` Grafana rule, which selects `type!="check"` and so already covers this
# job (GCPE labels it type=maintenance). This template used to curl the same
# channel directly from an EXIT trap; that predated the metric alert and became
# a duplicate notification for every failure.
#
# Usage in consumer repo's .gitlab-ci.yml:
#
#   include:
#     - project: 'org/ci-workflows'
#       ref: main
#       file: '/gitlab/assemble-changelog.yml'
#
#   assemble-changelog:
#     extends: .assemble-changelog
#     stage: .pre
#     rules:
#       - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
#
# Optional variables:
#   VERSION_FILE       Path to the version file (default: VERSION)
#   VERSION_FILE_TYPE  'plain' or 'json' (default: plain)
#   VERSION_JSON_KEY   Key holding the version when VERSION_FILE_TYPE=json (default: version)
#   CHANGELOG_DIR      Directory of fragments (default: changelog.d)
#   CHANGELOG_FILE     Assembled changelog (default: CHANGELOG.md)
#   GITLAB_PUSH_TOKEN  PAT/deploy token with write_repository; falls back to CI_JOB_TOKEN.

.assemble-changelog:
  # Pre-baked ci-alpine-utils image (git + jq + bash); see CI_ALPINE_UTILS_IMAGE
  # group var. before_script install is a no-op fallback on the pre-baked image.
  image: $CI_ALPINE_UTILS_IMAGE
  variables:
    GIT_DEPTH: 0
    VERSION_FILE: "VERSION"
    VERSION_FILE_TYPE: "plain"
    VERSION_JSON_KEY: "version"
    CHANGELOG_DIR: "changelog.d"
    CHANGELOG_FILE: "CHANGELOG.md"
  before_script:
    - command -v git >/dev/null 2>&1 && command -v jq >/dev/null 2>&1 || apk add --no-cache git jq
  script:
    - |
      set -e

      # Nothing to do if there are no fragments — keeps the follow-up pipeline
      # (triggered by our own push) from looping.
      if ! ls "$CHANGELOG_DIR"/*.md >/dev/null 2>&1; then
        echo "No changelog fragments in $CHANGELOG_DIR — nothing to assemble."
        exit 0
      fi

      if [ "$VERSION_FILE_TYPE" = "json" ]; then
        VERSION=$(jq -r ".$VERSION_JSON_KEY" "$VERSION_FILE" | tr -d '[:space:]')
      else
        VERSION=$(cat "$VERSION_FILE" | tr -d '[:space:]')
      fi
      DATE=$(date -u +%Y-%m-%d)

      # Refuse to fold into a version that has already been released.
      #
      # Without this, a fragment whose MR forgot to bump VERSION_FILE is folded
      # into a section for a version that is already tagged. Two things then go
      # wrong, both silently: this job appends a SECOND "## [$VERSION]" block, and
      # the follow-up pipeline's tag job finds the tag already present, so it sets
      # TAG_CREATED=false and skips — and .release skips with it. Both jobs go
      # green, the change is documented under a release it is not part of, and it
      # never gets a tag of its own. Every subsequent fold repeats it, because
      # VERSION never moves.
      #
      # Fail loudly instead. Choosing the new version is the author's call, not
      # something to guess here. A red job is already routed to #ci-alerts by the
      # "GitLab CI job failed after final retry" rule (see the note above).
      VERSION_RE=$(printf '%s' "$VERSION" | sed 's/[][\.*^$\/]/\\&/g')
      if [ -f "$CHANGELOG_FILE" ] && grep -q "^## \[$VERSION_RE\]" "$CHANGELOG_FILE"; then
        echo "error: $CHANGELOG_FILE already has a '## [$VERSION]' section, but"       >&2
        echo "  $CHANGELOG_DIR still holds fragments:"                                 >&2
        ls "$CHANGELOG_DIR"/*.md | sed 's/^/    /'                                     >&2
        echo "  Whatever added them did not bump $VERSION_FILE, so folding now would"  >&2
        echo "  file the change under an already-released version and it would never"  >&2
        echo "  be tagged. Bump $VERSION_FILE and re-run."                             >&2
        exit 1
      fi

      # Build the new section: one bullet per fragment paragraph.
      SECTION=$(mktemp)
      {
        printf '## [%s] - %s\n\n### Changed\n\n' "$VERSION" "$DATE"
        for f in "$CHANGELOG_DIR"/*.md; do
          # A bullet is a PARAGRAPH, not a physical line. Printing '- ' in front
          # of every non-empty line broke three ways: a hard-wrapped paragraph
          # came out as one bullet per line, a fragment already written with its
          # own '- ' came out as '- - ', and an intentional list could not be
          # told apart from a wrapped sentence.
          #
          # A line opening with '-' or '*' starts a new bullet and its marker is
          # consumed rather than doubled; any other non-blank line is a
          # continuation joined onto the current bullet with a space; a blank
          # line closes it. Single-quoted so the shell leaves awk's $0 alone.
          #
          # Known limitation: a fragment that writes its own '### Section'
          # heading still lands as a bullet. This template owns the section
          # structure and emits '### Changed' itself.
          awk '
            function flush() { if (buf != "") { print "- " buf; buf = "" } }
            /^[[:space:]]*$/                { flush(); next }
            /^[[:space:]]*[-*][[:space:]]+/ { flush(); sub(/^[[:space:]]*[-*][[:space:]]+/, ""); buf = $0; next }
                                            { sub(/^[[:space:]]+/, ""); buf = (buf == "" ? $0 : buf " " $0) }
            END                             { flush() }
          ' "$f"
        done
        printf '\n'
      } > "$SECTION"

      # Prepend the section above the first existing "## [" heading; otherwise
      # start (or seed) the changelog.
      TMP=$(mktemp)
      if [ -f "$CHANGELOG_FILE" ] && grep -q '^## \[' "$CHANGELOG_FILE"; then
        awk -v sect="$SECTION" '
          !done && /^## \[/ { while ((getline l < sect) > 0) print l; done=1 }
          { print }
        ' "$CHANGELOG_FILE" > "$TMP"
      elif [ -f "$CHANGELOG_FILE" ]; then
        cat "$CHANGELOG_FILE" "$SECTION" > "$TMP"
      else
        printf '# Changelog\n\n' > "$TMP"
        cat "$SECTION" >> "$TMP"
      fi
      mv "$TMP" "$CHANGELOG_FILE"

      git rm -q "$CHANGELOG_DIR"/*.md

      echo "Assembled changelog section for $VERSION:"
      echo "----"
      cat "$SECTION"
      echo "----"

      git config user.email "ci@gitlab"
      git config user.name "GitLab CI"
      if [ -n "$GITLAB_PUSH_TOKEN" ]; then
        git remote set-url origin "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      else
        echo "warning: GITLAB_PUSH_TOKEN not set — pushing with CI_JOB_TOKEN," >&2
        echo "  which does not trigger a follow-up pipeline." >&2
        git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      fi
      git add "$CHANGELOG_FILE"
      git commit -m "docs: assemble changelog for $VERSION"
      git push origin "HEAD:${CI_DEFAULT_BRANCH}"


# Merge-request-side guard. The fold guard inside .assemble-changelog above
# refuses to fold a fragment into a version that already has a section, but it
# runs on the default branch, after the merge — by then the only signal is a red
# pipeline on main and the change is already in. This asks the same question on
# the merge request, where the author can still fix it.
#
# Both are wanted, and they catch different things. This job cannot see a race:
# two merge requests open at once can each bump to the same new version, both
# pass here, and the second to merge still folds into a version that now has a
# section. The default-branch guard is what catches that.
#
# The failure mode this is really aimed at is not forgetfulness, it is a rebase.
# A branch that correctly bumped 2.5.88 -> 2.5.89 and then rebased onto a main
# that had already released 2.5.89 has its bump applied away with NO conflict:
# the file already says what the commit wanted it to say. The merge request
# silently loses a changed file and the diff view shows nothing unusual.
# Observed on discord-bot!235 on 2026-08-20.
changelog-fragment-check:
  stage: .pre
  # Pre-baked ci-alpine-utils image (git + jq + bash); see CI_ALPINE_UTILS_IMAGE
  # group var. before_script install is a no-op fallback on the pre-baked image.
  image: $CI_ALPINE_UTILS_IMAGE
  variables:
    # Needed for the diff against the target branch — a shallow clone may not
    # contain the merge base.
    GIT_DEPTH: 0
    VERSION_FILE: "VERSION"
    VERSION_FILE_TYPE: "plain"
    VERSION_JSON_KEY: "version"
    CHANGELOG_DIR: "changelog.d"
    CHANGELOG_FILE: "CHANGELOG.md"
  before_script:
    - command -v git >/dev/null 2>&1 && command -v jq >/dev/null 2>&1 || apk add --no-cache git jq
  script:
    - |
      set -e

      read_version() {
        if [ "$VERSION_FILE_TYPE" = "json" ]; then
          jq -r ".$VERSION_JSON_KEY" | tr -d '[:space:]'
        else
          tr -d '[:space:]'
        fi
      }

      # CI_MERGE_REQUEST_DIFF_BASE_SHA is the merge base GitLab computed for the
      # MR. Fall back to computing it, so the job still works if a pipeline runs
      # without it set.
      BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      if [ -z "$BASE" ]; then
        git fetch -q origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        BASE=$(git merge-base HEAD "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME")
      fi
      echo "Comparing against merge base $BASE"

      # ACMR rather than just A: a fragment carried over and edited still needs a
      # version to land under. Deletions are ignored — reverting a fragment is
      # not a change that needs releasing.
      FRAGMENTS=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- "$CHANGELOG_DIR" | grep '\.md$' || true)
      if [ -z "$FRAGMENTS" ]; then
        echo "No $CHANGELOG_DIR fragments in this merge request — nothing to check."
        exit 0
      fi
      echo "Fragments in this merge request:"
      printf '%s\n' "$FRAGMENTS" | sed 's/^/    /'

      NEW=$(read_version < "$VERSION_FILE")
      OLD=$(git show "$BASE:$VERSION_FILE" 2>/dev/null | read_version || true)

      if [ -z "$OLD" ]; then
        echo "note: $VERSION_FILE does not exist at the merge base; treating $NEW as a bump."
      elif [ "$NEW" = "$OLD" ]; then
        echo "error: this merge request adds a $CHANGELOG_DIR fragment but leaves"    >&2
        echo "  $VERSION_FILE at $NEW, the same value as $CI_MERGE_REQUEST_TARGET_BRANCH_NAME." >&2
        echo ""                                                                        >&2
        echo "  Merging it would fold the fragment into a version that is already"     >&2
        echo "  released, and the tag job would then skip because that tag exists —"    >&2
        echo "  so the change would ship with no release of its own."                   >&2
        echo ""                                                                         >&2
        echo "  If you did bump it, check whether a rebase applied the bump away:"      >&2
        echo "    git diff origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME..HEAD -- $VERSION_FILE" >&2
        echo "  That is silent — rebasing onto a main that already released your"       >&2
        echo "  target version drops the change with no conflict."                      >&2
        exit 1
      fi

      VERSION_RE=$(printf '%s' "$NEW" | sed 's/[][\.*^$\/]/\\&/g')
      if [ -f "$CHANGELOG_FILE" ] && grep -q "^## \[$VERSION_RE\]" "$CHANGELOG_FILE"; then
        echo "error: $VERSION_FILE is $NEW, but $CHANGELOG_FILE already has a"  >&2
        echo "  '## [$NEW]' section — that version has been released."          >&2
        echo "  Pick a version that has not shipped yet."                       >&2
        exit 1
      fi

      echo "OK: $VERSION_FILE moved ${OLD:-<absent>} -> $NEW and $NEW has no section yet."
  rules:
    # Fork MRs require a project member to trigger jobs — prevents untrusted
    # code from running CI automatically. allow_failure is set explicitly
    # because GitLab defaults manual jobs to allow_failure: true, which would
    # let a triggered-and-failing check pass the merge request anyway.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
      when: manual
      allow_failure: false
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
